<!doctype html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuscaLivro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/styles.css">

</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                BuscaLivro
            </a>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">
                        Sobre
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Contato
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <main class="flex-grow-1">

        <section class="container py-5">

            <div class="text-center mb-4">
                <h1>Encontre seu próximo livro</h1>
                <p class="text-muted">
                    Pesquise por título, autor ou palavra-chave.
                </p>
            </div>

            <form id="form-busca" class="mx-auto" style="max-width: 700px;">

                <div class="input-group">

                    <div class="flex-grow-1">
                        <input id="input-busca" type="text" class="form-control"
                            placeholder="Pesquise seus livros favoritos..."
                            aria-label="Pesquise seus livros favoritos...">

                        <div class="invalid-feedback">
                            Digite pelo menos 3 caracteres.
                        </div>
                    </div>

                    <button id="btn-buscar" class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i>
                    </button>

                </div>

            </form>

            <section id="resultados" class="mt-5">

                <div class="spinner-wrap d-none" id="spinner-wrap">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">
                                Buscando livros...
                            </span>
                        </div>
                    </div>

                    <div class="text-center mt-2">
                        Buscando livros...
                    </div>
                </div>
            </section>

            <div id="buscar-mais" class="text-center mt-4 d-none">
                <button class="btn btn-outline-primary" type="button">
                    Buscar mais
                </button>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white p-3 pb-5 d-flex justify-content-around align-items-center">
        <div class="fs-3">BuscaLivro</div>
        <div>© Copyright 2020 LuisFrag. All rights reserved.</div>
        <div>
            <i class="bi bi-github fs-3"></i>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/script.js"></script>

</body>

</html>
